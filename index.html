<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaD Sandbox - Lead Gen</title>
    <!-- GTM Placeholder -->
    <!-- Paste your GTM container code here in Lab 2 -->
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding-top: 50px; }
        .container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { font-size: 24px; color: #333; margin-top: 0; }
        label { display: block; margin: 15px 0 5px; color: #666; font-size: 14px; }
        input[type="text"], input[type="email"], input[type="tel"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #1a73e8; color: white; padding: 12px 20px; border: none; border-radius: 4px; width: 100%; cursor: pointer; margin-top: 20px; font-size: 16px; }
        button:hover { background-color: #1557b0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Request a Quote</h1>
        <p style="color: #666; font-size: 14px;">This is your Dollar-a-Day Sandbox Landing Page.</p>
        <form action="thank-you.html" method="GET">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
            
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>
            
            <!-- Hidden field to capture GCLID for offline conversion imports -->
            <input type="hidden" id="gclid_field" name="gclid" value="">

            <button type="submit">Submit Request</button>
        </form>
    </div>

    <script>
        // Extract GCLID from the URL and inject it into the hidden form field
        const urlParams = new URLSearchParams(window.location.search);
        const gclid = urlParams.get('gclid');
        if (gclid) {
            document.getElementById('gclid_field').value = gclid;
            // Also store it in localStorage to mimic how real CRMs persist it across sessions
            localStorage.setItem('gclid', gclid);
        }
    </script>
</body>
</html>

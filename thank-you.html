<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - DaD Sandbox</title>
    <!-- GTM Placeholder -->
    <!-- Paste your GTM container code here in Lab 2 -->
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding-top: 50px; text-align: center; }
        .container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { font-size: 24px; color: #1e8e3e; margin-top: 0; }
        .data-box { background: #f8f9fa; border: 1px solid #ddd; padding: 15px; text-align: left; border-radius: 4px; margin-top: 20px; font-size: 13px; font-family: monospace; color: #333; overflow-wrap: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Thank You!</h1>
        <p>Your lead has been submitted successfully.</p>
        
        <div class="data-box" id="submitted-data">
            <strong>Data Captured (For ECL/OCT Testing):</strong><br><br>
        </div>
        <a href="index.html" style="display:inline-block; margin-top:20px; color:#1a73e8; text-decoration:none;">&larr; Back to Form</a>
    </div>

    <script>
        // Display the data passed from the form for easy debugging
        const urlParams = window.location.search;
        const decodedParams = decodeURIComponent(urlParams.replace('?', ''));
        const pairs = decodedParams.split('&');
        
        let outputHTML = '<strong>Data Captured (For ECL Testing):</strong><br><br>';
        pairs.forEach(pair => {
            const [key, value] = pair.split('=');
            if(key) {
                // In production, this data (email, phone) is what GTM grabs for Enhanced Conversions for Leads
                outputHTML += `<strong>${key}:</strong> ${value || '[Empty]'}<br>`;
            }
        });

        // Pull GCLID from localStorage if it wasn't passed via URL
        if (!decodedParams.includes('gclid=')) {
            const storedGclid = localStorage.getItem('gclid');
            if (storedGclid) {
                outputHTML += `<strong>gclid (from Storage):</strong> ${storedGclid}<br>`;
            }
        }

        document.getElementById('submitted-data').innerHTML = outputHTML;
    </script>
</body>
</html>
